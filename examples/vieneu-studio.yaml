name: VieNeu Studio — gallery, editor, video decode
# Manual smoke test for the VieNeu Studio on this phone.
#   vem (or: vieneu-studio start)   # in another shell
#   pwterm run examples/vieneu-studio.yaml
#
# The automated suite (tests/vieneu-studio.spec.js) asserts much more; this
# flow is for eyeballing the screens and catching the obvious breakage.
baseUrl: http://127.0.0.1:7861
timeout: 30000
viewport: { width: 1280, height: 860 }

steps:
  - goto: /
  - expectTitle: /VieNeu/
  - expectVisible: '.vcard'
  - screenshot: artifacts/vieneu-gallery.png

  # Open the first project card — the URL owns the project id.
  - click: '.vcard'
  - waitForUrl: '/project/'
  - expectVisible: '#projectTitle'
  - expectVisible: '#video'
  - expectVisible: '#cueLane .cue'

  # The video must actually decode: readyState >= 2 and a non-zero width.
  # (This is the check that catches "downloaded an AV1 source".)
  - wait: 2500
  - eval: "(() => { const v = document.querySelector('#video'); return { readyState: v.readyState, width: v.videoWidth, height: v.videoHeight, duration: Math.round(v.duration), error: v.error && v.error.code }; })()"
  - screenshot: artifacts/vieneu-editor.png

  # Providers are server-side; choosing the AI engine reveals the saved list.
  - click: '[data-tab="translate"]'
  - expectVisible: '[data-page="translate"]'
  - select: { selector: '#translator', value: 'openai' }
  - expectVisible: '#provider'
  - expectVisible: '#manageProviders'
  - eval: "[...document.querySelectorAll('#provider option')].map(o => o.textContent.trim())"
  - screenshot: artifacts/vieneu-translate.png

  - click: 'a[aria-label="All videos"]'
  - expectUrl: /\/$/
  - expectVisible: '.vcard'
